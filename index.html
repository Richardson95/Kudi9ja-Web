<!doctype html>
<html lang="en-NG" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Kudi9ja — save at a fixed rate paid upfront, borrow for your business, and run your Ajo circle. Pay smart. Pay global." />
    <link rel="icon" type="image/png" href="/brand/mark_gold.png" />
    <link rel="apple-touch-icon" href="/brand/app_icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet" />
    <title>Kudi9ja — Pay smart. Pay global.</title>
    <script>
      // Paint the right theme before React loads, so there is no flash.
      try {
        var mode = localStorage.getItem('k9.theme') || 'dark';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.className = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
